name: Gerar APK Android

on:
  push:
    branches: [main]
    paths: ["android/**", "windows/modelos.json", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # O Android SDK já vem instalado na máquina do GitHub (ANDROID_HOME).
      - name: Conferir Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # A tabela de modelos é a mesma do programa do Windows
      - name: Copiar tabela de modelos
        run: cp windows/modelos.json android/app/src/main/assets/modelos.json

      - name: Compilar APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ManutencaoEpson-apk
          path: android/app/build/outputs/apk/release/app-release.apk
