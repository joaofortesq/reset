name: Gerar APK Android

on:
  push:
    branches: [main]
    paths: ["android/**", "windows/modelos.json", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # A tabela de modelos é a mesma do programa do Windows
      - name: Copiar tabela de modelos
        run: cp windows/modelos.json android/app/src/main/assets/modelos.json

      - name: Compilar APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ManutencaoEpson-apk
          path: android/app/build/outputs/apk/release/app-release.apk
